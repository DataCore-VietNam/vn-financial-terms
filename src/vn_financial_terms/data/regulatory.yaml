# Regulatory, legal, and governance terminology
# References: Vietnamese legislative system; MOF / SSC / SBV regulatory framework

- en: State Securities Commission
  vi: Ủy ban Chứng khoán Nhà nước
  en_abbr: SSC
  vi_abbr: UBCKNN
  domain: regulatory
  notes: The securities regulator, under the Ministry of Finance.

- en: Ministry of Finance
  vi: Bộ Tài chính
