  domain: regulatory

- en: Circular
  vi: Thông tư
  vi_abbr: TT
  domain: regulatory
  notes: Issued by ministries to guide implementation of laws and decrees.

- en: Decree
  vi: Nghị định
  vi_abbr: NĐ
  domain: regulatory
  notes: Issued by the government to provide detailed regulations.

- en: Decision
  vi: Quyết định
  vi_abbr: QĐ
  domain: regulatory

- en: Resolution
  vi: Nghị quyết
  domain: regulatory

- en: Law
  vi: Luật
